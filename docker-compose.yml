# Development stack: `docker compose up --build` runs the database, the API on
# http://localhost:5600 and the board on http://localhost:3200. `docker compose
# up db` runs only the database, for a backend and frontend run on the host.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: runofshow
      POSTGRES_USER: runofshow
      POSTGRES_PASSWORD: runofshow
    ports:
      # This machine only: the password is in this file.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runofshow"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "1"
      MEDIA_ROOT: /app/media
      CORS_ALLOWED_ORIGINS: http://localhost:3200
      FRONTEND_URL: http://localhost:3200
      # Set LAN_HOSTS (in a .env file beside this one, or the shell) to use the
      # board from other machines, e.g. LAN_HOSTS=adams-macbook-pro.local,192.168.1.241
      LAN_HOSTS: ${LAN_HOSTS:-}
    ports:
      - "5600:5600"
    volumes:
      - ./backend:/app/backend
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The board calls the API on port 5600 of whichever host it was loaded from.
      LAN_HOSTS: ${LAN_HOSTS:-}
    ports:
      - "3200:3200"
    volumes:
      - ./frontend:/app/frontend
      # Keep the image's node_modules (built for Linux) over the host's.
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media:
