services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: runofshow
      POSTGRES_USER: runofshow
      POSTGRES_PASSWORD: runofshow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runofshow"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
