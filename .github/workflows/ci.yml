name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.yml, so settings.py's defaults apply.
      db:
        image: postgres:17
        env:
          POSTGRES_DB: runofshow
          POSTGRES_USER: runofshow
          POSTGRES_PASSWORD: runofshow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runofshow"
          --health-interval 2s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
